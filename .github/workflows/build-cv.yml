name: Build CV PDFs

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile CVs
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            ES_CV_Ana Karen Canales Santos.tex
            EN_CV_Ana Karen Canales Santos.tex
          latexmk_use_xelatex: true

      - name: Upload CV PDFs
        uses: actions/upload-artifact@v4
        with:
          name: CV-PDFs
          path: |
            ES_CV_Ana Karen Canales Santos.pdf
            EN_CV_Ana Karen Canales Santos.pdf